# Alternatif menjalankan tanpa install PostgreSQL / .NET SDK:
#   docker compose up --build
# API:  http://localhost:8080/scalar   (dokumentasi interaktif)
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: OrderManagement
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d OrderManagement"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Host=db;Port=5432;Database=OrderManagement;Username=postgres;Password=postgres"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
